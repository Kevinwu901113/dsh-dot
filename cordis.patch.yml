# dsh-dot: turn dsh into an always-on personal agent. Installed together with
# dsh-computer, dsh-im, dsh-budget and the official schedule bundle (see README).

- insert:
    - id: dsh-dot
      name: 'dsh-dot/core'
      config:
        # Where AGENTS.md (the dot's identity and duties) lives; sessions started here load it.
        home: !!js "process.env.DSH_DOT_HOME ?? ''"
