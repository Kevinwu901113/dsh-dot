# dsh-dot: one plugin, seven components. The character lives on her own devices.
#   phone     — her phone: an Android emulator this plugin installs, boots and keeps alive;
#               tools mcp__dot-phone__* (mobile-mcp over adb). Headless: watched on dsh's own pages.
#               DSH_DOT_PHONE=off turns it off.
#   computer  — optional: a microVM (microsandbox, bundled; Docker as fallback) with shell, browser,
#               desktop, live view, approval gates, audit log. The VM is the isolation boundary.
#               DSH_DOT_COMPUTER=off turns it off (the host subprocess/sandbox settings stay stock).
#   qq        — her QQ on her computer: NapCat or SnowLuma (OneBot 11, /qq backend) inside the VM,
#               same account as the phone app; logged in by her phone scanning the code (/qq qr).
#               Messages wake her instantly; what she says goes out through it. Needs the computer.
#               DSH_DOT_QQ=off turns it off.
#   dot       — her conversation (only the one the plugin makes for her), what wakes her (one way in,
#               one clock), her hands (phone, computer, web, this machine: one thing a place, places at
#               once), the book of things, what needs his yes (asked in her words, no approval cards),
#               her words written from her card and sent one way, failures and a used-up account told
#               in the plugin's name. Needs dsh-im and dsh's schedule service (see README).
#               DSH_DOT_CONTACT=off turns it off.
#   memory    — what she remembers (his and her words and recall, notes on him and her, people, diary). DSH_DOT_MEMORY=off.
#   compat    — living next to qq-bridge: per-session tool visibility, where its commands run, its bot
#               accounts kept out of her QQ. DSH_DOT_COMPAT=off turns it off.
#   interlude — her persona (the Canon / persona.md, HDSI presets by share code) as a prompt section,
#               and 自己的时间: time of her own in her conversation, once after his quiet or the start
#               of her day (and when she left herself a later).
#               DSH_DOT_INTERLUDE=off turns it off.
# Every component tolerates a sibling being off (services are looked up with ctx.get(...)?.).

# 1. Replace the host subprocess provider with the VM-backed one.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: !!js "process.env.DSH_DOT_COMPUTER !== 'off'"

# 2. The VM is the boundary, so host landlock/bwrap wrapping is off; approvals stay on.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_DOT_COMPUTER === 'off' ? (process.env.DSH_PERMISSION_MODE ?? 'workspace-write') : 'danger-full-access'"
    workspaceRoot: !!js process.cwd()
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets: !!js "process.env.DSH_DOT_COMPUTER === 'off' ? { 'read-only': { sandbox: 'read-only', approval: 'ask' }, 'workspace-write': { sandbox: 'workspace-write', approval: 'ask' }, 'danger-full-access': { sandbox: 'danger-full-access', approval: 'never' } } : { 'computer': { sandbox: 'danger-full-access', approval: 'ask' }, 'computer-auto': { sandbox: 'danger-full-access', approval: 'never' } }"
    defaultPreset: !!js "process.env.DSH_DOT_COMPUTER === 'off' ? 'workspace-write' : (process.env.DSH_COMPUTER_PRESET ?? 'computer')"

# Her conversation's own agent preset (dot.lean): the rows of dsh's `standard` preset she keeps — files of her own,
# schedules, goals, compaction — and none of the rest (shell, jobs, file search, the web, skills, plan mode,
# subagents and workflows, ask-user, todo, present, office, plugin manager): looking things up is her hands' work. Her other tools are this plugin's own.
# A session's preset decides which host tools its requests list; nothing takes them out afterwards.
- insert:
    - id: preset-dot
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dot
        name: dot
        description: dot 的对话：只带她自己的工具（dsh-dot）
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              readImage: false
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    # Her hands' own presets, one a place (tool-prefixes.js HANDS_PRESETS): the rows of `standard` that doing there takes,
    # and nothing to plan, delegate, ask or present with. A session's preset decides which host tools its requests list,
    # and nothing takes them out afterwards — so a thing on the web or on her phone is made with a preset that has no
    # shell and no files (11-24: one preset for every place, and a thing given to look something up had a shell).
    # Every step of a thing resends the tool list, and the hands are most of what she spends.
    - id: preset-dot-hands-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dot-hands-phone
        name: dot-hands-phone
        description: dot 的手（手机）：查资料；手机的工具由 dsh-dot 给
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an agent operating a phone, powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-dot-hands-computer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dot-hands-computer
        name: dot-hands-computer
        description: dot 的手（她的电脑）：命令行、读文件、查资料
        order: 92
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an agent operating a computer, powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              # her hands read files; what they change goes through the shell, where the gates see it
              write: false
              edit: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-dot-hands-host
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dot-hands-host
        name: dot-hands-host
        description: dot 的手（他这台电脑本机）：命令行、读文件、查资料
        order: 93
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an agent working on this machine with a shell, powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              # her hands read files; what they change goes through the shell, where the gates see it
              write: false
              edit: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: preset-dot-hands-web
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dot-hands-web
        name: dot-hands-web
        description: dot 的手（查资料）：只有查资料
        order: 94
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an agent looking things up on the web, powered by the {{model}} model.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

- insert:
    # 0. Living next to other plugins (qq-bridge today): whose session is this, which of our tools it
    #    may see, where its commands run, which QQ accounts are not hers to answer. Always on; it only
    #    does something when qq-bridge is found (docs/qq-bridge.md). DSH_DOT_COMPAT=off turns it off.
    - id: dot-compat
      disabled: !!js "process.env.DSH_DOT_COMPAT === 'off'"
      name: 'dsh-dot-life/compat'
    - id: dot-computer
      disabled: !!js "process.env.DSH_DOT_COMPUTER === 'off'"
      name: 'dsh-dot-life/computer'
      config:
        backend: !!js "process.env.DSH_COMPUTER_BACKEND ?? ''"
        port: !!js "Number(process.env.DSH_COMPUTER_PORT ?? 18080)"
        image: !!js "process.env.DSH_COMPUTER_IMAGE ?? ''"
        # Public origin of this dsh (your own exposure, e.g. `tailscale serve`); the live view is served there
        # behind dsh's login. Never the VM gateway port: it is keyed and answers only to dsh-dot.
        publicUrl: !!js "process.env.DSH_COMPUTER_PUBLIC_URL ?? ''"
        # Folders shared with the VM at the same path (':' separated; ';' on Windows). Default: each session's workspace, shared on first use (see README).
        mounts: !!js "process.env.DSH_COMPUTER_MOUNTS ? process.env.DSH_COMPUTER_MOUNTS.split(process.platform === 'win32' ? ';' : ':').filter(Boolean) : []"
    - id: dot-subprocess
      disabled: !!js "process.env.DSH_DOT_COMPUTER === 'off'"
      name: 'dsh-dot-life/subprocess'
    - id: dot-gate
      disabled: !!js "process.env.DSH_DOT_COMPUTER === 'off'"
      name: 'dsh-dot-life/gate'
      config:
        mode: !!js "process.env.DSH_COMPUTER_GATE ?? 'risky'"
    # 3. Browser + desktop tools served from inside the VM (tool names: mcp__dot-vm__*) are mounted by the
    #    computer component itself, so the MCP client carries the gateway key (see docs/computer.md).
    # 4. Desktop/Web UI: right-Sidebar "Computer" tab (live view) and a header toggle.
    - id: dot-ui
      disabled: !!js "process.env.DSH_DOT_COMPUTER === 'off'"
      name: 'dsh-dot-life'
    # 5. Her phone (see src/phone/phone.js). First start downloads ~2 GB from Google's repository once
    #    the SDK license is accepted (`/phone accept`, or acceptLicense: true here).
    - id: dot-phone
      name: 'dsh-dot-life/phone'
      disabled: !!js "process.env.DSH_DOT_PHONE === 'off'"
      config:
        # Headless by default (she is watched on the dot page / the live view); DSH_DOT_PHONE_WINDOW=on also opens the emulator's own window.
        window: !!js "process.env.DSH_DOT_PHONE_WINDOW === 'on' ? true : process.env.DSH_DOT_PHONE_WINDOW === 'off' ? false : undefined"
        acceptLicense: !!js "process.env.DSH_DOT_PHONE_ACCEPT_LICENSE === 'yes' ? true : undefined"
        # Live view + controls at <dsh>/dsh-dot/phone/, behind dsh's own login (no port of its own).
        # publicUrl: the public origin of this dsh if you expose it (tailscale serve, remote access).
        publicUrl: !!js "process.env.DSH_DOT_PUBLIC_URL ?? process.env.DSH_COMPUTER_PUBLIC_URL ?? ''"
    # 6. The always-on glue (was the standalone dsh-dot plugin).
    - id: dot
      name: 'dsh-dot-life/dot'
      disabled: !!js "process.env.DSH_DOT_CONTACT === 'off'"
      config:
        # dot's home: her files live here. Her conversation is the one the plugin makes for her, not any session started here.
        home: !!js "process.env.DSH_DOT_HOME ?? ''"
    # 6b. What she remembers (after Hermes and dsh-whale-inurqq): you, her own notes, the people she
    #     meets in her apps, what happened. Her conversation is handed over to a fresh session past
    #     handoffTokens (long before dsh's own compaction at 80% of the window). Files: <home>/memory/.
    - id: dot-memory
      name: 'dsh-dot-life/memory'
      disabled: !!js "process.env.DSH_DOT_MEMORY === 'off'"
      config:
        home: !!js "process.env.DSH_DOT_HOME ?? ''"
        # Next to another memory plugin: auto (people-only when one is found) · full · people-only.
        coexist: !!js "process.env.DSH_DOT_MEMORY_COEXIST ?? 'auto'"
        # handoffTokens: 150000
    # 7. Her persona and her own time (the component keeps the name interlude). Shares dot's home: <home>/interlude/.
    - id: dot-interlude
      name: 'dsh-dot-life/interlude'
      disabled: !!js "process.env.DSH_DOT_INTERLUDE === 'off'"
      config:
        home: !!js "process.env.DSH_INTERLUDE_HOME ?? process.env.DSH_DOT_HOME ?? ''"
    # 8. Her QQ on the computer (NapCat in the VM). /qq install once, /qq account <number>, /qq qr to log in.
    - id: dot-qq
      name: 'dsh-dot-life/qq'
      disabled: !!js "process.env.DSH_DOT_QQ === 'off' || process.env.DSH_DOT_COMPUTER === 'off'"
      config:
        qq: !!js "process.env.DSH_DOT_QQ_ACCOUNT ?? ''"
        githubProxy: !!js "process.env.DSH_DOT_GITHUB_PROXY ?? ''"
